<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AWD Pipe — QR Registration & Monitoring System</title>
    <script>
      (function() {
        try {
          var params = new URLSearchParams(window.location.search);
          if (params.has('id')) {
            var savedUser = localStorage.getItem('awd_current_user');
            if (!savedUser) {
              window.location.replace('https://drreddysfoundation.org/');
            }
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
